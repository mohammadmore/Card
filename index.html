<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="same-origin">
    <title>پلتفرم یکپارچه صدور کارت</title>
    <link rel="icon" id="app-favicon" href="./assets/logo.svg">
    <!-- assets/app.css و assets/app.js با «npm run build» از پوشه src ساخته می‌شوند -->
    <!-- حالت تیره پیش از نمایش صفحه اعمال می‌شود تا صفحه‌ی سفید چشمک نزند (منطق کامل در src/app.jsx) -->
    <script>try{var m=localStorage.getItem('ui_theme');if(m==='dark'||((!m||m==='system')&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
    <link rel="stylesheet" href="./assets/app.css">
    <script src="./assets/react.production.min.js"></script>
    <script src="./assets/react-dom.production.min.js"></script>
    <script src="./assets/lucide.min.js"></script>
    <script src="./assets/JsBarcode.all.min.js"></script>
    <script src="./assets/qrious.min.js"></script>
</head>
<body class="text-slate-800 antialiased min-h-screen">
    <div id="root">
        <div class="loader-container">
            <div class="spinner"></div>
            <div class="loading-text">در حال راه‌اندازی پلتفرم...</div>
        </div>
    </div>
    <script src="./assets/app.js"></script>
</body>
</html>
